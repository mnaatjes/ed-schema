name: Downstream Hexagonal Boundary & Quality CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify (${{ matrix.os }} / Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Astral uv
        uses: astral-sh/setup-uv@v3

      - name: Synchronize Virtual Environment & Install Package
        run: |
          uv sync --all-extras
          uv pip install -e .

      - name: Run Deterministic Verification Runner
        run: uv run python scripts/verify.py

      - name: Assert Zero Uncommitted Drift
        shell: bash
        run: git diff --exit-code
